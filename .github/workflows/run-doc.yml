name: Doc CI

# Markdown lint. Report-only for now: existing documents contain findings, so
# the job never fails; the report is uploaded as an artifact.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # markdownlint prints findings on stderr, so capture both streams.
      - name: Run markdownlint
        run: |
          npx --yes markdownlint-cli '**/*.md' --ignore node_modules 2>&1 | tee docs_report.md || true

      - name: Upload markdownlint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdownlint-report
          path: docs_report.md
