name: Rust CI Reusable Workflow

on:
  workflow_call:
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: timpani_rust

      # Prebuilt binaries: avoids compiling cargo-deny and cargo-tarpaulin from
      # source on every run. installdeps.sh and test_coverage.sh only run
      # `cargo install` for them when they are missing.
      - name: Install cargo-deny and cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-tarpaulin

      - name: Make scripts executable
        run: chmod +x scripts/rust/*.sh

      - name: Install project dependencies
        run: ./scripts/rust/installdeps.sh

      - name: Create output folders
        run: |
          mkdir -p dist/reports/fmt
          mkdir -p dist/reports/deny
          mkdir -p dist/tests
          mkdir -p dist/coverage/workspace
          mkdir -p dist/reports/clippy

      - name: Build and parse project
        run: ./scripts/rust/buildNparse.sh

      - name: Run tests and generate report
        run: ./scripts/rust/testNparse.sh

      - name: Run Clippy (lint)
        run: ./scripts/rust/clippy_check.sh

      - name: Run format check
        run: ./scripts/rust/fmt_check.sh

      - name: Run cargo-deny checks
        run: ./scripts/rust/deny_check.sh

      - name: Run test coverage script
        run: ./scripts/rust/test_coverage.sh

      - name: Upload deny report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deny-report
          path: dist/reports/deny/deny_summary.md

      - name: Upload fmt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fmt-report
          path: dist/reports/fmt/fmt_summary.md

      - name: Upload clippy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clippy-report
          path: dist/reports/clippy/clippy_summary.md

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: dist/tests/*

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: dist/coverage/*
