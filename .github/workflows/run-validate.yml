name: Validate Workflow YAML

# Lints every workflow with actionlint: YAML syntax, job/needs graph,
# ${{ }} expressions, action inputs, and shellcheck on `run:` scripts.
# Reusable, and can also be triggered manually.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      # The image bundles shellcheck and pyflakes. Pinned so results are
      # reproducible; bump the version deliberately.
      - name: Lint workflows with actionlint
        run: |
          docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12
